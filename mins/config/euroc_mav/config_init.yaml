%YAML:1.0 # need to specify the file type at the top!

init:
  window_time: 2.0 # how many seconds to collect initialization information
  imu_thresh: 1.5 # threshold for variance of the accelerometer to detect a "jerk" in motion
  imu_only_init: true  
  imu_wait_for_jerk: false # Initialize only after a stationary IMU and visual window.
  imu_static_accel_std: 0.15
  imu_static_gyro_std: 0.02
  use_gt: false
  cov_size: 1e-3
